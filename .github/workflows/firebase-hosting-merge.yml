name: Deploy to Firebase Hosting on merge

# - push su `feature` -> sito di staging (target `staging`, runica-heros-folio-staging)
# - push su `main`    -> sito di produzione (target `live`, runica-heros-folio)
# Entrambi pubblicano sul canale "live" del rispettivo sito.
on:
  push:
    branches:
      - main
      - feature

# Un solo deploy alla volta per ramo; uno nuovo sostituisce quello ancora in coda.
concurrency:
  group: hosting-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_staging:
    if: ${{ github.ref == 'refs/heads/feature' }}
    runs-on: ubuntu-latest
    # Configurazione di build: la config web di Firebase arriva dai secret del
    # repository; nome e icone usano il branding di staging.
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME_STAGING || 'Runica (staging)' }}
      VITE_APP_SHORT_NAME: ${{ vars.VITE_APP_SHORT_NAME_STAGING || 'Runica β' }}
      VITE_PWA_ICON_192: /icons/icon-staging-192.png
      VITE_PWA_ICON_512: /icons/icon-staging-512.png
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Firebase config
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing VITE_FIREBASE_* repository secrets. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build (staging)
        run: npm run build:staging

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RUNICA_HEROS_FOLIO }}
          channelId: live
          projectId: runica-heros-folio
          target: staging

  deploy_live:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'Runica' }}
      VITE_APP_SHORT_NAME: ${{ vars.VITE_APP_SHORT_NAME || 'Runica' }}
      VITE_PWA_ICON_192: /icons/icon-192.png
      VITE_PWA_ICON_512: /icons/icon-512.png
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Firebase config
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing VITE_FIREBASE_* repository secrets. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build (produzione)
        run: npm run build:live

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RUNICA_HEROS_FOLIO }}
          channelId: live
          projectId: runica-heros-folio
          target: live
